<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Badge Lab｜edu-assets</title>
  <style>
    :root{--ink:#101522;--blue:#19bfe8;--yellow:#ffd52e;--pink:#ff5da2;--paper:#f6fbff;--card:#fff;--line:#d9e7ef}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:linear-gradient(135deg,#e8fbff,#fff7c8 48%,#ffe9f4);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
    .hero{padding:48px 20px 34px;text-align:center;background:linear-gradient(135deg,#13bde7,#6b6df5 55%,#ff5ca8);color:#fff;border-bottom:6px solid var(--ink);box-shadow:0 5px 0 #fff}
    .hero h1{margin:0;font-size:clamp(2rem,5vw,4rem);letter-spacing:.04em;text-shadow:4px 4px 0 var(--ink)}.hero p{margin:14px auto 0;max-width:720px;font-weight:700;font-size:1.05rem}
    .wrap{width:min(1180px,calc(100% - 28px));margin:0 auto}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:22px 0}.toolbar input{flex:1 1 260px;min-height:46px;border:3px solid var(--ink);border-radius:14px;padding:0 15px;font:inherit;background:#fff}.collections{display:flex;gap:8px;flex-wrap:wrap;width:100%}.collection{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:10px 16px;font-weight:900;cursor:pointer}.collection[aria-pressed=true]{background:var(--pink);color:#fff;box-shadow:3px 3px 0 var(--ink)}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:2px solid var(--ink);border-radius:999px;background:#fff;padding:9px 14px;font-weight:800;cursor:pointer}.filter[aria-pressed=true]{background:var(--yellow);box-shadow:3px 3px 0 var(--ink)}
    .summary{font-weight:800;margin:4px 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;padding-bottom:45px}.card{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:12px;box-shadow:5px 5px 0 var(--ink);display:flex;flex-direction:column;min-width:0}.badge{width:100%;aspect-ratio:1;object-fit:contain;background:radial-gradient(circle,#e9fbff 0 60%,#d4f5ff);border-radius:14px}.name{font-size:1.15rem;margin:10px 2px 2px}.meaning{margin:0 2px;min-height:2.8em;color:#44515d;font-size:.9rem;font-weight:650}.meta{margin:10px 2px 0;color:#596b76;font-size:.75rem;overflow-wrap:anywhere}.actions{display:flex;gap:7px;margin-top:10px}.actions button,.actions a{flex:1;text-align:center;border:2px solid var(--ink);border-radius:10px;padding:8px 5px;background:#fff;font:inherit;font-size:.78rem;font-weight:800;color:var(--ink);text-decoration:none;cursor:pointer}.actions button:hover,.actions a:hover{background:var(--pink);color:#fff}.empty{grid-column:1/-1;text-align:center;padding:50px;font-weight:800}.footer{text-align:center;padding:25px;background:#fff;border-top:3px solid var(--ink);font-size:.85rem}.footer a{color:inherit;font-weight:800}
  </style>
</head>
<body>
  <header class="hero"><div class="wrap"><h1>BADGE LAB</h1><p>共通・国語・算数・理科。学びの成長を集めるバッジコレクション</p></div></header>
  <main class="wrap">
    <div class="toolbar"><input id="search" type="search" placeholder="バッジを検索…" aria-label="バッジを検索"><div class="collections" id="collections" aria-label="バッジの種類"></div><div class="filters" id="filters"></div></div>
    <p class="summary" id="summary"></p><section class="grid" id="grid" aria-live="polite"></section>
  </main>
  <footer class="footer"><a href="https://github.com/TT-sensei/edu-assets">edu-assets on GitHub</a> · Badge Lab</footer>
  <script>
    const commonBadges = [
      ['first-step','はじめの一歩','はじめる・挑戦','初めて学習に取り組んだ'],['challenger','チャレンジャー','はじめる・挑戦','新しい課題に挑戦した'],['courage','勇気の一歩','はじめる・挑戦','苦手な問題にも挑戦した'],['explorer','エクスプローラー','はじめる・挑戦','新しい分野を試した'],['adventurer','学びの冒険者','はじめる・挑戦','学習の冒険を始めた'],
      ['great-answer','ナイスアンサー','正解・達成','問題に正解した'],['perfect','パーフェクト','正解・達成','1セットを全問正解した'],['clear','クリア','正解・達成','ステージを最後まで終えた'],['mission-complete','ミッション達成','正解・達成','指定された課題を達成した'],['champion','チャンピオン','正解・達成','すばらしい成績を残した'],
      ['keep-going','継続パワー','継続・努力','継続して学習した'],['hard-worker','努力家','継続・努力','何度も練習して力を伸ばした'],['never-give-up','あきらめない心','継続・努力','間違い直しに取り組んだ'],['comeback','カムバック','継続・努力','失敗後に立て直した'],['steady-progress','一歩ずつ','継続・努力','少しずつ記録を伸ばした'],
      ['level-up','レベルアップ','成長・レベルアップ','スキルレベルが上がった'],['growth','成長の芽','成長・レベルアップ','前よりできることが増えた'],['power-up','パワーアップ','成長・レベルアップ','新しい力を身につけた'],['new-skill','新スキル','成長・レベルアップ','新しい技能を習得した'],['mastery','マスター','成長・レベルアップ','技能を安定して使えた'],
      ['focus','集中モード','集中・スピード・連続','集中して課題に取り組んだ'],['speed','スピードスター','集中・スピード・連続','すばやく正確に解けた'],['combo','コンボ','集中・スピード・連続','連続正解を達成した'],['streak','ストリーク','集中・スピード・連続','連続日数・連続達成を更新した'],['accuracy','正確無比','集中・スピード・連続','正確に問題を解いた'],
      ['discovery','発見','発見・知識・特別','新しいことに気づいた'],['idea','ひらめき','発見・知識・特別','よい考えや方法を見つけた'],['knowledge','知識の本','発見・知識・特別','必要な知識を身につけた'],['treasure','トレジャー','発見・知識・特別','特別な成果を見つけた'],['special','スペシャル','発見・知識・特別','レアな特別実績を達成した']
      ,['try-again','もういちど！','再挑戦・復習・工夫','間違えたあと、あきらめずに再挑戦した'],['breakthrough','にがて突破','再挑戦・復習・工夫','苦手だった問題や課題を克服した'],['review-master','ふくしゅう名人','再挑戦・復習・工夫','以前学習した内容を復習した'],['practice-master','れんしゅう名人','再挑戦・復習・工夫','同じ技能や問題に繰り返し取り組んだ'],['creative','ひらめき名人','再挑戦・復習・工夫','自分なりの方法や工夫を考えた'],
      ['deep-thinker','じっくり思考','考える・伝える','すぐに答えを出さず、じっくり考えた'],['problem-solver','かいけつ名人','考える・伝える','自分で解決方法を見つけた'],['observer','かんさつ名人','考える・伝える','細かなところまでよく見て、違いや特徴を見つけた'],['connection','つながった！','考える・伝える','別々に学んだこと同士の関係やつながりに気づいた'],['explainer','せつめい名人','考える・伝える','答えだけでなく、理由や自分の考えを説明できた'],
      ['independent','じぶんでできた','協力・自立・特別','ヒントなどに頼らず、自分の力でやり遂げた'],['teamwork','きょうりょく名人','協力・自立・特別','仲間と協力して取り組んだ'],['helper','おたすけ名人','協力・自立・特別','困っている仲間を助けたり、学習を支えたりした'],['curiosity','なぜ？を大切に','協力・自立・特別','疑問をもって、もっと知ろうと学習した'],['hidden-badge','ひみつのバッジ','協力・自立・特別','特殊条件を満たして隠し実績を達成した']
    ];

    const subjectBadges = {
      japanese: [
        ['manuscript','ますめマスター','書く','考えを文章としてしっかり書いた'],['bookmark','読みすすめた！','読む','文章や本を読み進めた'],['careful-writing','ていねい文字','書く','文字をていねいに書いた'],['self-correction','見直し名人','読む・書く','読み返して改善した'],['expression','表現名人','表現','自分らしい言葉や表現を使った'],
        ['word-sprout','ことのはの芽','言葉','新しい言葉を知った'],['word-tree','ことのはの樹','言葉','使える言葉を増やした'],['word-weaver','ことばの紡ぎ手','文づくり','言葉や文をつないだ'],['between-the-lines','行間を読む','読む','書かれていないことまで想像した'],['word-detective','ことば探偵','読む','表現や手がかりに気づいた'],
        ['reading-aloud','音読マスター','読む','声に出してしっかり読んだ'],['language-rhythm','ことばの響き','表現','言葉の響きやリズムを味わった'],['book-lover','本となかよし','読む','本や文章を楽しんだ'],['language-explorer','日本語たんけん','言葉','言葉や文の仕組みを調べた'],['words-connect','ことばの架け橋','伝える','考えや気持ちを言葉で伝えた']
      ],
      math: [
        ['number-sense','数となかよし','数・数量感覚','数の大きさやまとまりをとらえた'],['calculation','計算マスター','計算','計算する力を高めた'],['mental-math','頭の中で！','暗算・数の操作','頭の中で数を動かして考えた'],['number-line','数の道','数直線・順序・大小','数の順序や位置関係をとらえた'],['relationship','関係発見！','数量関係','数や量、図形の関係を見つけた'],
        ['pattern','きまり発見！','規則性','並びから規則やきまりを見つけた'],['geometry','図形マスター','図形','図形の特徴や性質をとらえた'],['spatial-sense','空間マスター','立体・空間認識','立体の形や位置関係をイメージした'],['measurement','はかる名人','測定','量を比べたり測ったりした'],['fraction-sense','わける・まとめる','分割・割合的な見方','部分と全体の関係を考えた'],
        ['visualize','図にしてみよう','図・モデル化','問題の内容を図に表した'],['logical-thinking','すじみち思考','論理・筋道','理由や順序を考えて答えにたどり着いた'],['strategy','作戦名人','解き方・見通し','解き方の見通しをもって取り組んだ'],['another-way','別の解き方！','多様な解法','別の考え方や解き方を見つけた'],['math-discovery','算数のひみつ','算数を楽しむ・発見','算数の仕組みや面白さを発見した']
      ]
    };
    subjectBadges.science = [
        ['science-observer','かんさつ博士','観察','対象をよく観察し、特徴や変化を見つけた'],['wonder','ふしぎ発見','問題発見','自然現象を見て疑問をもった'],['prediction','予想名人','予想','経験や知識をもとに結果を予想した'],['experiment','実験マスター','実験','実験を行って確かめた'],['fair-test','条件マスター','条件制御','変える条件とそろえる条件を考えた'],
        ['science-measure','測定マスター','測定','温度、時間、長さ、重さなどを測って調べた'],['science-record','記録名人','記録','観察や実験の結果を正確に記録した'],['compare-results','くらべて発見','比較','結果を比べ、共通点や違いを見つけた'],['evidence','結果から考える','考察','観察・実験の結果を根拠に考えた'],['life-science','生命のひみつ','生命・生物','植物、動物、人の体など生命の仕組みを学んだ'],
        ['earth-science','地球のひみつ','地球・天気・宇宙','天気、土地、流水、地球、月や太陽について学んだ'],['matter','もののひみつ','物質','物の性質、溶け方、状態変化を調べた'],['energy','エネルギー発見','物理・エネルギー','電気、磁石、力、光、音などの現象を調べた'],['science-connection','しくみがつながった！','関係・因果','自然の関係や仕組みを見つけた'],['science-discovery','科学のひみつ','理科を楽しむ・発見','自然や科学の面白さを発見した']
      ];
    const elementBadges = [
      ['shadow/level-1','SHADOW Lv.1 SHADE','影・FOUND','謎めいた影のエレメントを発見した'],
      ['shadow/level-2','SHADOW Lv.2 PHANTOM','影・EVOLVE','影のエレメントがファントムへ進化した'],
      ['shadow/level-3','SHADOW Lv.3 ECLIPSE SHADE','影・AWAKEN','影のエレメントがエクリプス・シェードへ覚醒した'],
      ['gravity/level-1','GRAVITY Lv.1 ORBIT','重力・FOUND','重力のエレメントを発見した'],
      ['gravity/level-2','GRAVITY Lv.2 PULL','重力・EVOLVE','重力のエレメントが引力を発現した'],
      ['gravity/level-3','GRAVITY Lv.3 SINGULARITY','重力・AWAKEN','重力のエレメントがシンギュラリティへ覚醒した']
    ];
    const collections={common:{label:'共通',root:'assets/badges/common/',badges:commonBadges},japanese:{label:'国語',root:'assets/badges/japanese/',badges:subjectBadges.japanese},math:{label:'算数',root:'assets/badges/math/',badges:subjectBadges.math},science:{label:'理科',root:'assets/badges/science/',badges:subjectBadges.science},elements:{label:'エレメント',root:'assets/elements/',badges:elementBadges}};
    let collection='common', category='すべて', badges=collections[collection].badges, root=collections[collection].root;
    const collectionsEl=document.querySelector('#collections');
    const filters=document.querySelector('#filters'), grid=document.querySelector('#grid'), search=document.querySelector('#search'), summary=document.querySelector('#summary');
    function renderCollections(){collectionsEl.innerHTML=Object.entries(collections).map(([key,value])=>`<button class="collection" type="button" aria-pressed="${key===collection}" data-collection="${key}">${value.label} <small>(${value.badges.length})</small></button>`).join('')}
    function renderFilters(){const categories=['すべて',...new Set(badges.map(x=>x[2]))];filters.innerHTML=categories.map(x=>`<button class="filter" type="button" aria-pressed="${x===category}" data-category="${x}">${x}</button>`).join('')}
    function switchCollection(next){collection=next;badges=collections[next].badges;root=collections[next].root;category='すべて';renderCollections();renderFilters();render()}
    function render(){const q=search.value.trim().toLowerCase();const list=badges.filter(([slug,name,cat,meaning])=>(category==='すべて'||cat===category)&&(!q||[slug,name,cat,meaning].join(' ').toLowerCase().includes(q)));summary.textContent=`${list.length} / ${badges.length} バッジ`;grid.innerHTML=list.length?list.map(([slug,name,cat,meaning])=>{const src=`${root}${slug}/badge.png`;return `<article class="card"><img class="badge" src="${src}" alt="${name}バッジ" loading="lazy"><h2 class="name">${name}</h2><p class="meaning">${meaning}</p><div class="meta">${slug} · ${cat}</div><div class="actions"><button type="button" data-copy="${location.origin+location.pathname}${src}">URLをコピー</button><a href="${src}" target="_blank" rel="noopener">画像を開く</a></div></article>`}).join(''):'<p class="empty">見つかりませんでした。</p>';document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);const old=b.textContent;b.textContent='コピーしました';setTimeout(()=>b.textContent=old,1200)}catch{prompt('URLをコピーしてください',b.dataset.copy)}}))}
    collectionsEl.addEventListener('click',e=>{const b=e.target.closest('[data-collection]');if(b)switchCollection(b.dataset.collection)});filters.addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;category=b.dataset.category;document.querySelectorAll('.filter').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});search.addEventListener('input',render);renderCollections();renderFilters();render();
  </script>
</body>
