    let collection='common', category='すべて', badges=collections[collection].badges, root=collections[collection].root;
    const collectionsEl=document.querySelector('#collections');
    const filters=document.querySelector('#filters'), grid=document.querySelector('#grid'), search=document.querySelector('#search'), summary=document.querySelector('#summary');
    const selectAll=document.querySelector('#selectAll'), downloadSelected=document.querySelector('#downloadSelected'), selectedCount=document.querySelector('#selectedCount'), downloadStatus=document.querySelector('#downloadStatus');
    const selected=new Map();
    function renderCollections(){collectionsEl.innerHTML=Object.entries(collections).map(([key,value])=>`<button class="collection" type="button" aria-pressed="${key===collection}" data-collection="${key}">${value.label} <small>(${value.badges.length})</small></button>`).join('')}
    function renderFilters(){const categories=collection==='elements'?['すべて',...badges.map(x=>x[0])]:['すべて',...new Set(badges.map(x=>x[2]))];const labels=collection==='elements'?Object.fromEntries([['すべて','全属性'],...badges.map(x=>[x[0],`${x[1]}／${x[2]}`])]):collection==='collections'?Object.fromEntries([['すべて','全シリーズ'],...categories.filter(x=>x!=='すべて').map(x=>[x,prettyCollectionName(x)])]):{};filters.innerHTML=categories.map(x=>`<button class="filter" type="button" aria-pressed="${x===category}" data-category="${x}">${labels[x]||x}</button>`).join('')}
    function switchCollection(next){collection=next;badges=collections[next].badges;root=collections[next].root;category='すべて';renderCollections();renderFilters();render()}
    function getVisibleList(){const q=search.value.trim().toLowerCase();return badges.filter(([slug,name,cat,meaning])=>(category==='すべて'||(collection==='elements'?slug===category:cat===category))&&(!q||[slug,name,cat,meaning].join(' ').toLowerCase().includes(q)))}
    function selectionKey(slug){return `${collection}:${slug}`}
    function syncSelectionUI(list=getVisibleList()){const count=selected.size;selectedCount.textContent=`(${count})`;downloadSelected.disabled=count===0;const visibleKeys=list.map(([slug])=>selectionKey(slug));const checked=visibleKeys.length>0&&visibleKeys.every(key=>selected.has(key));selectAll.checked=checked;selectAll.indeterminate=!checked&&visibleKeys.some(key=>selected.has(key))}
    function render(){
      const list=getVisibleList();
      if(collection==='elements'){
        summary.textContent=`${list.length} / ${badges.length} 属性`;
        grid.innerHTML=list.length?list.map(([slug,label,japanese,levels])=>{
          const key=selectionKey(slug),checked=selected.has(key);
          const visibleLevels=levels;
          return `<article class="card element-card${checked?' is-selected':''}">
            <label class="select-toggle"><input type="checkbox" data-select="${key}" ${checked?'checked':''}> この属性を選択</label>
            <h2 class="name">${label} <small>／${japanese}</small></h2>
            <div class="element-levels">${visibleLevels.map(level=>`<div class="element-level"><img class="badge" src="${level.src}" alt="${label} ${level.level} バッジ" loading="lazy"><strong>${level.level.replace('level-','Lv.')} · ${level.stage}</strong><span>${level.meaning}</span><div class="actions"><button type="button" data-copy="${location.origin+location.pathname}${level.src}">URLをコピー</button><a href="${level.src}" target="_blank" rel="noopener">画像を開く</a></div></div>`).join('')}</div>
          </article>`
        }).join(''):'<p class="empty">見つかりませんでした。</p>';
        document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);const old=b.textContent;b.textContent='コピーしました';setTimeout(()=>b.textContent=old,1200)}catch{prompt('URLをコピーしてください',b.dataset.copy)}}));
        syncSelectionUI(list); return;
      }
      summary.textContent=`${list.length} / ${badges.length} バッジ`;
      grid.innerHTML=list.length?list.map(([slug,name,cat,meaning])=>{const src=`${root}${slug}/badge.png`;const key=selectionKey(slug);const checked=selected.has(key);return `<article class="card${checked?' is-selected':''}"><img class="badge" src="${src}" alt="${name}バッジ" loading="lazy"><label class="select-toggle"><input type="checkbox" data-select="${key}" ${checked?'checked':''}> この画像を選択</label><h2 class="name">${name}</h2><p class="meaning">${meaning}</p><div class="meta">${slug} · ${cat}</div><div class="actions"><button type="button" data-copy="${location.origin+location.pathname}${src}">URLをコピー</button><a href="${src}" target="_blank" rel="noopener">画像を開く</a></div></article>`}).join(''):'<p class="empty">見つかりませんでした。</p>';document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);const old=b.textContent;b.textContent='コピーしました';setTimeout(()=>b.textContent=old,1200)}catch{prompt('URLをコピーしてください',b.dataset.copy)}}));syncSelectionUI(list)
    }
    grid.addEventListener('change',e=>{const input=e.target.closest('[data-select]');if(!input)return;const key=input.dataset.select;const slug=key.split(':').slice(1).join(':');if(collection==='elements'){const group=badges.find(([candidate])=>candidate===slug);if(input.checked)selected.set(key,{group:true,levels:group[3].map(level=>({src:level.src,filename:`badge-elements-${slug}-${level.level}.png`}))});else selected.delete(key)}else{if(input.checked)selected.set(key,{src:`${root}${slug}/badge.png`,filename:`badge-${collection}-${slug.replaceAll('/','-')}.png`});else selected.delete(key)};render()})
    selectAll.addEventListener('change',()=>{const list=getVisibleList();list.forEach(([slug,,,levels])=>{const key=selectionKey(slug);if(selectAll.checked){if(collection==='elements')selected.set(key,{group:true,levels:levels.map(level=>({src:level.src,filename:`badge-elements-${slug}-${level.level}.png`}))});else{const src=`${root}${slug}/badge.png`;selected.set(key,{src,filename:`badge-${collection}-${slug.replaceAll('/','-')}.png`})}}else selected.delete(key)});render()})
    downloadSelected.addEventListener('click',async()=>{if(!selected.size)return;downloadSelected.disabled=true;const files=[...selected.values()].flatMap(item=>item.group?item.levels:[item]);downloadStatus.textContent=`${files.length}枚を準備しています…`;let completed=0;for(const item of files){try{const response=await fetch(item.src);if(!response.ok)throw new Error('download failed');const blob=await response.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=item.filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);completed++;await new Promise(resolve=>setTimeout(resolve,180))}catch{downloadStatus.textContent='一部の画像をダウンロードできませんでした。個別の「画像を開く」から保存してください。';break}}if(completed===files.length)downloadStatus.textContent=`${completed}枚のダウンロードを開始しました。ブラウザの許可を確認してください。`;syncSelectionUI()})
    collectionsEl.addEventListener('click',e=>{const b=e.target.closest('[data-collection]');if(b)switchCollection(b.dataset.collection)});filters.addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;category=b.dataset.category;document.querySelectorAll('.filter').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});search.addEventListener('input',render);renderCollections();renderFilters();render();loadDynamicCollections();
