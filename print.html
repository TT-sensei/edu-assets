<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バッジ印刷｜edu-assets</title>
<style>
:root{--ink:#101522;--blue:#19bfe8;--yellow:#ffd52e;--pink:#ff5da2;--paper:#f6fbff;--card:#fff;--line:#d9e7ef}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:linear-gradient(135deg,#e8fbff,#fff7c8 48%,#ffe9f4);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 20px;background:linear-gradient(135deg,#13bde7,#6b6df5 55%,#ff5ca8);color:#fff;border-bottom:5px solid var(--ink)}
header h1{margin:0;font-size:1.6rem;letter-spacing:.03em}
header p{margin:2px 0 0;font-weight:700;font-size:.9rem}
header .spacer{flex:1}
.btn{display:inline-block;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);padding:11px 20px;font:inherit;font-weight:900;font-size:1rem;cursor:pointer;text-decoration:none;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn-print{background:var(--yellow)}
.btn-back{background:#fff}
main{width:min(1220px,calc(100% - 24px));margin:0 auto;padding:18px 0 50px}
.layout{display:grid;grid-template-columns:minmax(500px,1fr) 330px;gap:18px;align-items:start}
@media(max-width:960px){.layout{grid-template-columns:1fr}}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:16px;box-shadow:5px 5px 0 var(--ink)}
.panel h2{margin:0 0 12px;font-size:1.2rem}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.toolbar input[type=search]{flex:1 1 200px;min-height:46px;border:3px solid var(--ink);border-radius:14px;padding:0 14px;font:inherit;background:#fff}
.collections{display:flex;gap:8px;flex-wrap:wrap}
.collection{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:9px 15px;font:inherit;font-weight:900;cursor:pointer}
.collection[aria-pressed="true"]{background:var(--pink);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filter{border:2px solid var(--ink);border-radius:999px;background:#fff;padding:8px 14px;font:inherit;font-weight:800;cursor:pointer}
.filter[aria-pressed="true"]{background:var(--yellow);box-shadow:3px 3px 0 var(--ink)}
.summary{font-weight:800;margin:12px 0 10px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;max-height:560px;overflow:auto;padding:2px}
.lib-item{position:relative;border:2px solid var(--line);border-radius:14px;background:#fff;padding:8px 6px 7px;font:inherit;cursor:pointer;text-align:center}
.lib-item:hover{border-color:var(--pink)}
.lib-item img{width:100%;aspect-ratio:1;object-fit:contain;background:radial-gradient(circle,#e9fbff 0 60%,#d4f5ff);border-radius:10px}
.lib-item .nm{display:block;margin-top:5px;font-size:.72rem;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.lib-item .cnt{position:absolute;top:-7px;right:-5px;min-width:26px;height:26px;border-radius:999px;background:var(--pink);color:#fff;border:2px solid var(--ink);font-size:.8rem;font-weight:900;line-height:22px;padding:0 5px}
.empty{grid-column:1/-1;text-align:center;padding:36px;font-weight:800}
.field{margin:0 0 14px}
.field label{display:block;font-weight:900;margin:0 0 6px}
.field select{width:100%;min-height:48px;border:3px solid var(--ink);border-radius:12px;padding:0 10px;font:inherit;background:#fff}
.check{display:flex;align-items:center;gap:9px;font-weight:850;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--pink)}
.sheet-total{font-weight:900;font-size:1.05rem;background:#fff7d6;border:2px solid var(--ink);border-radius:12px;padding:10px 12px;margin:0 0 14px}
.side .btn{width:100%;text-align:center;margin:0 0 10px}
.btn-danger{background:#fff;color:#c2185b}
.note{color:#44515d;font-size:.85rem;font-weight:650;line-height:1.6}
.preview-panel{margin-top:18px}
#sheets{display:flex;flex-direction:column;gap:26px;align-items:center}
.sheet-wrap{width:100%;overflow:hidden}
.sheet{width:210mm;height:297mm;background:#fff;margin:0 auto;box-shadow:0 4px 18px rgba(16,21,34,.25);transform-origin:top center;flex:none}
.sheet-inner{width:100%;height:100%;padding:10mm;print-color-adjust:exact;-webkit-print-color-adjust:exact}
.sheet-grid{display:grid;gap:4mm;justify-content:center;align-content:start}
.cell{position:relative}
.cell img{width:100%;height:100%;object-fit:contain;display:block}
.cell .guide{position:absolute;inset:0;border:.45mm dashed #9aa7b1;border-radius:50%;pointer-events:none}
.cell-remove{position:absolute;top:-2.5mm;right:-2.5mm;width:8mm;height:8mm;border-radius:50%;border:.5mm solid var(--ink);background:#fff;color:var(--ink);font-size:4.5mm;font-weight:900;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.cell-remove:hover{background:var(--pink);color:#fff}
.sheet-empty{text-align:center;font-weight:800;padding:30px 10px;color:#44515d}
@media print{
 @page{size:A4 portrait;margin:0}
 html,body{width:210mm!important;background:#fff!important}
 header,main .layout,.preview-head{display:none!important}
 main{width:auto;padding:0}
 .preview-panel{margin:0;border:0;box-shadow:none;padding:0;background:transparent}
 #sheets{gap:0}
 .sheet-wrap{height:auto!important;overflow:visible}
 .sheet{transform:none!important;box-shadow:none;margin:0;page-break-after:always;break-after:page}
 .sheet:last-child{page-break-after:auto;break-after:auto}
 .cell-remove{display:none!important}
}
</style>
</head>
<body>
<header>
 <div>
  <h1>バッジ印刷</h1>
  <p>バッジを選んで、A4シートに並べて印刷できます。同じバッジを何枚でも追加できます。</p>
 </div>
 <span class="spacer"></span>
 <a class="btn btn-back" href="index.html">Badge Labにもどる</a>
 <button class="btn btn-print" type="button" data-print>印刷する／PDF保存</button>
</header>
<main>
 <div class="layout">
  <section class="panel pick">
   <h2>1. バッジを選ぶ</h2>
   <div class="toolbar">
    <input id="search" type="search" placeholder="バッジを検索…" aria-label="バッジを検索">
    <div class="collections" id="collections" aria-label="バッジの種類"></div>
    <div class="filters" id="filters"></div>
   </div>
   <p class="summary" id="summary"></p>
   <div class="lib" id="lib"></div>
  </section>
  <section class="panel side">
   <h2>2. 印刷の設定</h2>
   <p class="sheet-total" id="sheetTotal">シートには 0枚（0ページ）</p>
   <div class="field">
    <label for="size">バッジの大きさ</label>
    <select id="size">
     <option value="30">30mm（まる）</option>
     <option value="40" selected>40mm（まる）</option>
     <option value="50">50mm（まる）</option>
    </select>
   </div>
   <div class="field">
    <label class="check"><input type="checkbox" id="guide" checked> 切り取りガイド（点線の円）を表示する</label>
   </div>
   <button class="btn" type="button" data-print>印刷する／PDF保存</button>
   <button class="btn btn-danger" type="button" id="clearAll">シートを全部消す</button>
   <p class="note">シート上のバッジは、右上の × で1枚ずつ消せます。選んだバッジと設定は、この端末に自動で保存されます。印刷するときは、プリンター設定で「実際のサイズ（100%）」を選んでください。</p>
  </section>
 </div>
 <section class="panel preview-panel">
  <h2 class="preview-head">3. 印刷シート（A4）</h2>
  <div id="sheets"></div>
 </section>
</main>

const META = {"elementLabels":{"bubble":"BUBBLE／泡","candy":"CANDY／キャンディ","cloud":"CLOUD／雲","cosmos":"COSMOS／宇宙","dream":"DREAM／夢","earth":"EARTH／大地","fairy":"FAIRY／妖精","fire":"FIRE／炎","flower":"FLOWER／花","gravity":"GRAVITY／重力","heart":"HEART／ハート","ice":"ICE／氷","light":"LIGHT／光","luck":"LUCK／幸運","moon":"MOON／月","nature":"NATURE／自然","psychic":"PSYCHIC／エスパー","rain":"RAIN／雨","rainbow":"RAINBOW／虹","shadow":"SHADOW／影","sound":"SOUND／音","thunder":"THUNDER／雷","water":"WATER／水","wind":"WIND／風"},"seriesLabels":{"animal":"Animal","dinosaur":"Dinosaur","fantasy":"Fantasy","fruit":"Fruit","gem":"Gem","sea-animal":"Sea Animal","insect":"Insect","treasure":"Treasure","music":"Music","flower":"Flower"}};
const COLL_LABELS = {common:'共通',japanese:'国語',math:'算数',science:'理科',social:'社会',elements:'エレメント',collections:'コレクション'};
const LS_KEY = 'eduAssetsBadgePrint';
const byKey = new Map(BADGES.map(b => [`${b.coll}:${b.id}`, b]));
const $ = id => document.getElementById(id);

let collection = 'common', category = 'すべて';
let size = 40, guide = true, items = [];
try {
  const d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
  if (d) {
    if ([30, 40, 50].includes(d.size)) size = d.size;
    if (typeof d.guide === 'boolean') guide = d.guide;
    if (Array.isArray(d.items)) items = d.items.filter(k => byKey.has(k));
  }
} catch (e) {}
$('size').value = String(size);
$('guide').checked = guide;

function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ size, guide, items })); } catch (e) {}
}
function categoriesFor(coll) {
  if (coll === 'elements') return [...new Set(BADGES.filter(b => b.coll === coll).map(b => b.id.split('/')[0]))];
  return [...new Set(BADGES.filter(b => b.coll === coll).map(b => b.cat))];
}
function catLabel(coll, cat) {
  if (coll === 'elements') return (META.elementLabels || {})[cat] || cat;
  if (coll === 'collections') return (META.seriesLabels || {})[cat] || cat;
  return cat;
}
function visibleBadges() {
  const q = $('search').value.trim().toLowerCase();
  return BADGES.filter(b => {
    if (b.coll !== collection) return false;
    if (category !== 'すべて') {
      const c = collection === 'elements' ? b.id.split('/')[0] : b.cat;
      if (c !== category) return false;
    }
    if (q && ![b.id, b.name, b.cat, b.meaning].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
}
function countOnSheet(key) { return items.filter(k => k === key).length; }

function renderCollections() {
  $('collections').innerHTML = Object.keys(COLL_LABELS).map(k => {
    const n = BADGES.filter(b => b.coll === k).length;
    return `<button class="collection" type="button" aria-pressed="${k === collection}" data-coll="${k}">${COLL_LABELS[k]} <small>(${n})</small></button>`;
  }).join('');
}
function renderFilters() {
  const cats = ['すべて', ...categoriesFor(collection)];
  $('filters').innerHTML = cats.map(c => `<button class="filter" type="button" aria-pressed="${c === category}" data-cat="${c}">${c === 'すべて' ? 'すべて' : catLabel(collection, c)}</button>`).join('');
}
function renderLib() {
  const list = visibleBadges();
  const total = BADGES.filter(b => b.coll === collection).length;
  $('summary').textContent = `${list.length} / ${total} バッジ`;
  $('lib').innerHTML = list.length ? list.map(b => {
    const key = `${b.coll}:${b.id}`, n = countOnSheet(key);
    return `<button class="lib-item" type="button" data-add="${key}" title="${b.meaning}"><img src="${b.web}" alt="${b.name}バッジ" loading="lazy"><span class="nm">${b.name}</span>${n ? `<span class="cnt">${n}</span>` : ''}</button>`;
  }).join('') : '<p class="empty">見つかりませんでした。</p>';
}
function layout() {
  const gap = 4, contentW = 190, contentH = 277;
  const cols = Math.max(1, Math.floor((contentW + gap) / (size + gap)));
  const rows = Math.max(1, Math.floor((contentH + gap) / (size + gap)));
  return { cols, rows, per: cols * rows };
}
function renderSheet() {
  const { cols, per } = layout();
  const pages = [];
  for (let i = 0; i < items.length; i += per) pages.push(items.slice(i, i + per));
  $('sheetTotal').textContent = `シートには ${items.length}枚（${pages.length}ページ）`;
  $('sheets').innerHTML = items.length ? pages.map((page, pi) =>
    `<div class="sheet-wrap"><div class="sheet"><div class="sheet-inner"><div class="sheet-grid" style="grid-template-columns:repeat(${cols},${size}mm)">${
      page.map((key, ci) => {
        const b = byKey.get(key), gi = pi * per + ci;
        return `<div class="cell" style="width:${size}mm;height:${size}mm"><img src="${b.web}" alt="${b.name}バッジ">${guide ? '<span class="guide"></span>' : ''}<button class="cell-remove" type="button" data-remove="${gi}" aria-label="${b.name}を1枚消す">×</button></div>`;
      }).join('')
    }</div></div></div></div>`
  ).join('') : '<p class="sheet-empty">バッジを選ぶと、ここに印刷シートが表示されます。</p>';
  fitPreview();
}
function fitPreview() {
  document.querySelectorAll('.sheet-wrap').forEach(wrap => {
    const sheet = wrap.querySelector('.sheet');
    if (!sheet) return;
    sheet.style.transform = 'none';
    const w = sheet.offsetWidth, h = sheet.offsetHeight;
    if (!w) return;
    const scale = Math.min(1, wrap.clientWidth / w);
    sheet.style.transform = `scale(${scale})`;
    wrap.style.height = (h * scale) + 'px';
  });
}
function render() { renderLib(); renderSheet(); save(); }

$('collections').addEventListener('click', e => {
  const b = e.target.closest('[data-coll]'); if (!b) return;
  collection = b.dataset.coll; category = 'すべて';
  renderCollections(); renderFilters(); renderLib();
});
$('filters').addEventListener('click', e => {
  const b = e.target.closest('[data-cat]'); if (!b) return;
  category = b.dataset.cat; renderFilters(); renderLib();
});
$('search').addEventListener('input', renderLib);
$('lib').addEventListener('click', e => {
  const b = e.target.closest('[data-add]'); if (!b) return;
  items.push(b.dataset.add); render();
});
$('sheets').addEventListener('click', e => {
  const b = e.target.closest('[data-remove]'); if (!b) return;
  items.splice(Number(b.dataset.remove), 1); render();
});
$('size').addEventListener('input', () => { size = Number($('size').value); renderSheet(); save(); });
$('guide').addEventListener('input', () => { guide = $('guide').checked; renderSheet(); save(); });
$('clearAll').addEventListener('click', () => { items = []; render(); });
document.querySelectorAll('[data-print]').forEach(b => b.addEventListener('click', () => window.print()));
window.addEventListener('resize', fitPreview);
window.addEventListener('beforeprint', () => document.querySelectorAll('.sheet').forEach(s => s.style.transform = 'none'));
window.addEventListener('afterprint', fitPreview);
renderCollections(); renderFilters(); render();
</script>
